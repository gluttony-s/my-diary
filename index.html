<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Дневник</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121214">
</head>
<body>

  <div class="app">
    <!-- Шапка -->
    <header class="header">
      <div class="month-selector">
        <button id="prev-week">‹</button>
        <h2 id="month-title">Сентябрь 2026</h2>
        <button id="next-week">›</button>
      </div>
    </header>

    <!-- Сетка дней -->
    <div id="week-days" class="week-grid"></div>

    <!-- Заголовок выбранного дня -->
    <div class="day-header">
      <h3 id="selected-date-title">25 сентября</h3>
      <div class="moods">
        <button class="mood-btn" data-mood="😊">😊</button>
        <button class="mood-btn" data-mood="🙂">🙂</button>
        <button class="mood-btn" data-mood="😐">😐</button>
        <button class="mood-btn" data-mood="😔">😔</button>
        <button class="mood-btn" data-mood="🔥">🔥</button>
      </div>
    </div>

    <!-- Карточки -->
    <div id="cards-container" class="cards-container"></div>

    <!-- Кнопка (+) -->
    <button id="add-card-btn" class="fab-btn">+</button>

    <!-- Радиальное меню -->
    <div class="radial-menu-container">
      <button id="radial-toggle-btn" class="radial-main-btn">
        <span class="bar bar1"></span>
        <span class="bar bar2"></span>
        <span class="bar bar3"></span>
      </button>
      <div id="radial-options" class="radial-options hidden">
        <button id="opt-ai" class="radial-item" title="AI Ассистент">🤖</button>
        <button id="opt-export" class="radial-item" title="Скачать бэкап">📥</button>
        <label class="radial-item" title="Загрузить бэкап">
          📤
          <input type="file" id="import-file" accept=".json" style="display: none;">
        </label>
      </div>
    </div>
  </div>

  <!-- ПОЛНОЭКРАННЫЙ РЕДАКТОР ЗАПИСЕЙ -->
  <div id="editor-overlay" class="overlay hidden">
    <div class="modal full-screen-modal">
      
      <div class="modal-header">
        <button id="close-editor-btn" class="text-btn">Отмена</button>
        <span id="modal-date-display" class="modal-date"></span>
        <button id="save-card-btn" class="text-btn primary-text">Готово</button>
      </div>

      <div class="editor-body">
        <input type="text" id="card-topic-input" placeholder="Заголовок">
        <textarea id="card-desc-input" placeholder="Начни писать..."></textarea>
        <div id="modal-photo-list" class="modal-photo-list"></div>
      </div>

      <div class="editor-footer">
        <label class="icon-btn-footer">
          📷 Фото
          <input type="file" id="photo-input" accept="image/*" style="display: none;">
        </label>
        <button id="delete-card-btn" class="icon-btn-footer del-btn hidden">🗑️ Удалить</button>
      </div>

    </div>
  </div>

  <!-- ОКНО УМНОГО AI -->
  <div id="ai-overlay" class="overlay hidden">
    <div class="modal ai-modal">
      <div class="modal-header">
        <h3>🤖 AI-помощник</h3>
        <button id="close-ai-btn" class="icon-btn">✕</button>
      </div>
      <div class="ai-box">
        <input type="password" id="ai-key-input" placeholder="Вставь бесплатный Gemini API Key..." style="background:#27272a; border:1px solid #3f3f46; color:#fff; padding:8px; border-radius:6px; font-size:12px;">
        <textarea id="ai-question-input" placeholder="Например: В какие дни я тренировался?"></textarea>
        <button id="ai-ask-btn" class="save-btn">Спросить</button>
        <div id="ai-response-area" class="ai-response hidden"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
