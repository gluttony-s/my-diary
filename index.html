<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный Дневник & Планировщик</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#121214">
</head>
<body>

  <div class="app-container" id="swipe-area">
    <header class="app-header">
      <button id="prev-week" class="nav-btn">‹</button>
      <div class="month-selector" id="month-selector">
        <h2 id="month-title">Октябрь 2026</h2>
        <input type="date" id="calendar-picker">
      </div>
      <button id="next-week" class="nav-btn">›</button>
    </header>

    <div id="week-days" class="week-days"></div>

    <div class="day-status-bar">
      <h3 id="selected-date-title">2 октября</h3>
      <div class="mood-selector">
        <button class="mood-btn" data-mood="😊">😊</button>
        <button class="mood-btn" data-mood="😐">😐</button>
        <button class="mood-btn" data-mood="😔">😔</button>
        <button class="mood-btn" data-mood="🔥">🔥</button>
      </div>
    </div>

    <main class="day-content">
      <div class="main-note-section">
        <textarea id="main-note-input" placeholder="Как прошёл твой день?..."></textarea>
      </div>

      <div class="center-action-buttons">
        <button id="opt-add-topic" class="action-btn topic-btn">📝 Добавить подтему</button>
        <button id="opt-add-task" class="action-btn task-btn">✅ Добавить задачу</button>
      </div>

      <div id="subtopics-container" class="subtopics-container"></div>

      <div class="todos-section">
        <div class="section-title">
          <h4>Задачи</h4>
          <span id="todos-counter" class="counter">0/0</span>
        </div>
        <div id="todo-list" class="todo-list"></div>
      </div>

      <div class="photos-section">
        <div class="section-title">
          <h4>Фотографии</h4>
          <label for="photo-input" class="add-photo-label">+ Добавить фото</label>
          <input type="file" id="photo-input" accept="image/*" class="hidden">
        </div>
        <div id="photo-list" class="photo-grid"></div>
      </div>
    </main>

    <div class="floating-controls">
      <div class="radial-menu">
        <button id="radial-toggle-btn" class="circle-btn settings-btn" title="Настройки">⚙️</button>
        <div id="radial-options" class="radial-options hidden">
          <button id="opt-smart-export" class="radial-opt-btn" title="Выборочный экспорт и слияние">🗂️</button>
          <button id="opt-export" class="radial-opt-btn" title="Скачать всё">📥</button>
          <label for="import-file" class="radial-opt-btn" title="Загрузить бэкап">📤</label>
          <input type="file" id="import-file" accept=".json" class="hidden">
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно (Подтемы) -->
  <div id="modal-overlay" class="overlay hidden">
    <div class="modal-card full-editor-modal">
      <div class="modal-header">
        <h3 id="modal-title">Подтема</h3>
        <button id="modal-cancel-top-btn" class="icon-close-btn">✕</button>
      </div>
      <input type="text" id="modal-input-title" placeholder="Заголовок подтемы..." autocomplete="off" data-lpignore="true">
      <textarea id="modal-input-body" placeholder="Пишите здесь... Пространство автоматически расширяется во весь экран над клавиатурой."></textarea>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="secondary-btn">Отмена</button>
        <button id="modal-save-btn" class="primary-btn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно (Задачи) -->
  <div id="task-overlay" class="overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Новая задача</h3>
        <button id="task-cancel-top-btn" class="icon-close-btn">✕</button>
      </div>
      <input type="text" id="task-input-text" placeholder="Что нужно сделать?" autocomplete="off" data-lpignore="true">
      <div class="alarm-wrapper">
        <label for="task-input-time">⏰ Будильник:</label>
        <input type="time" id="task-input-time">
      </div>
      <div class="modal-actions">
        <button id="task-cancel-btn" class="secondary-btn">Отмена</button>
        <button id="task-save-btn" class="primary-btn">Добавить</button>
      </div>
    </div>
  </div>

  <!-- Умный поиск / выбор записей / слияние -->
  <div id="sync-overlay" class="overlay hidden">
    <div class="modal-card sync-modal-card">
      <div class="modal-header">
        <div>
          <h3>Умный поиск и добавление</h3>
          <p class="sync-hint">Начните вводить название — список обновляется сразу. Можно выбрать нужные записи галочками.</p>
        </div>
        <button id="sync-close-btn" class="icon-close-btn" aria-label="Закрыть">✕</button>
      </div>

      <input type="search" id="sync-search-input"
             placeholder="Поиск по задачам и подтемам, например: Т"
             autocomplete="off">

      <div class="sync-filters">
        <label>С <input type="date" id="sync-date-start"></label>
        <label>По <input type="date" id="sync-date-end"></label>
      </div>

      <div class="sync-file-row">
        <label for="sync-merge-input" class="secondary-btn sync-file-btn">Выбрать существующий JSON</label>
        <input type="file" id="sync-merge-input" accept=".json" class="hidden">
        <span id="sync-file-name" class="sync-file-name">Файл для добавления не выбран</span>
      </div>

      <div class="sync-summary">
        <span id="sync-results-count">Найдено: 0</span>
        <span id="sync-selected-count">Выбрано: 0</span>
        <span id="sync-new-count">Новых: 0</span>
      </div>

      <div id="sync-results" class="sync-results" aria-live="polite"></div>

      <div class="modal-actions sync-actions">
        <button id="sync-export-new-btn" class="secondary-btn">Скачать выбранное</button>
        <button id="sync-merge-selected-btn" class="primary-btn" disabled>Добавить выбранное в файл</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(error => console.log('Ошибка SW:', error));
      });
    }
  </script>
</body>
</html>
