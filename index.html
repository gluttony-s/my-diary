<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный Дневник</title>
  <link rel="stylesheet" href="style.css">

  <!-- Рендеринг формул LaTeX (KaTeX) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Рендеринг Markdown (Marked) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.2/lib/marked.umd.min.js"></script>
</head>
<body>

  <div class="app-container">
    <!-- Шапка с месяцем и календарем -->
    <header class="app-header">
      <button id="prev-week" class="nav-btn">‹</button>
      <div class="month-selector" id="month-selector">
        <h2 id="month-title">Сентябрь 2026</h2>
        <input type="date" id="calendar-picker">
      </div>
      <button id="next-week" class="nav-btn">›</button>
    </header>

    <!-- Лента 7 дней -->
    <div id="week-days" class="week-days"></div>

    <!-- Статус дня -->
    <div class="day-status-bar">
      <h3 id="selected-date-title">25 сентября</h3>
      <div class="mood-selector">
        <button class="mood-btn" data-mood="😊">😊</button>
        <button class="mood-btn" data-mood="😐">😐</button>
        <button class="mood-btn" data-mood="😔">😔</button>
        <button class="mood-btn" data-mood="🔥">🔥</button>
      </div>
    </div>

    <!-- Основной контент -->
    <main class="day-content">
      <!-- 1. ОСНОВНОЕ ОКНО -->
      <div class="main-note-section">
        <textarea id="main-note-input" placeholder="Как прошёл твой день? Запиши главные мысли..."></textarea>
      </div>

      <!-- 2. ПОДТЕМЫ -->
      <div id="subtopics-container" class="subtopics-container"></div>

      <!-- 3. ЗАДАЧИ -->
      <div class="todos-section">
        <div class="section-title">
          <h4>Задачи</h4>
          <span id="todos-counter" class="counter">0/0</span>
        </div>
        <div id="todo-list" class="todo-list"></div>
      </div>

      <!-- 4. ФОТОГРАФИИ -->
      <div class="photos-section">
        <div class="section-title">
          <h4>Фотографии</h4>
          <label for="photo-input" class="add-photo-label">+ Добавить фото</label>
          <input type="file" id="photo-input" accept="image/*" class="hidden">
        </div>
        <div id="photo-list" class="photo-grid"></div>
      </div>
    </main>

    <!-- НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="floating-controls">
      <div class="add-menu-wrapper">
        <div id="plus-options" class="plus-options hidden">
          <button id="opt-add-topic" class="circle-btn opt-topic" title="Добавить подтему">T</button>
          <button id="opt-add-task" class="circle-btn opt-task" title="Добавить задачу">✓</button>
        </div>
        <button id="add-main-btn" class="circle-btn main-plus-btn" title="Добавить">
          <svg viewBox="0 0 24 24" class="btn-icon">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </button>
      </div>

      <div class="radial-menu">
        <button id="radial-toggle-btn" class="circle-btn settings-btn" title="Настройки">
          <svg viewBox="0 0 24 24" class="btn-icon icon-settings">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
          </svg>
        </button>
        <div id="radial-options" class="radial-options hidden">
          <button id="opt-ai" class="radial-opt-btn" title="AI-Чат">🤖</button>
          <button id="opt-export" class="radial-opt-btn" title="Скачать бэкап">📥</button>
          <label for="import-file" class="radial-opt-btn" title="Загрузить бэкап">📤</label>
          <input type="file" id="import-file" accept=".json" class="hidden">
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно -->
  <div id="modal-overlay" class="overlay hidden">
    <div class="modal-card">
      <h3 id="modal-title">Новая подтема</h3>
      <input type="text" id="modal-input-title" placeholder="Название...">
      <textarea id="modal-input-body" placeholder="Описание..." class="hidden"></textarea>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="secondary-btn">Отмена</button>
        <button id="modal-save-btn" class="primary-btn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- AI Оверлей -->
  <div id="ai-overlay" class="overlay hidden">
    <div class="ai-container">
      <div class="ai-header">
        <h3>AI-Ассистент</h3>
        <div class="ai-header-controls">
          <button id="clear-chat-btn" class="text-btn" title="Очистить чат">Очистить</button>
          <button id="close-ai-btn" class="icon-btn">✕</button>
        </div>
      </div>
      <div class="ai-key-box">
        <input type="password" id="ai-key-input" placeholder="Введи OpenRouter API ключ (sk-or-v1-...)">
      </div>
      <div id="ai-response-area" class="ai-chat-history"></div>
      <div class="ai-input-box">
        <input type="text" id="ai-question-input" placeholder="Задай вопрос...">
        <button id="ai-ask-btn" class="primary-btn">Отправить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
