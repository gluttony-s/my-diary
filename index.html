<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач и тренировок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <h2>Темы</h2>
            <ul class="filter-list" id="topic-list">
                <!-- Генерируется через JS -->
            </ul>

            <h2>Дни</h2>
            <ul class="filter-list" id="day-list">
                <!-- Генерируется через JS -->
            </ul>
        </aside>

        <!-- Основная область -->
        <main class="content">
            <header class="content-header">
                <h1>Выбранные записи</h1>
                <div class="actions">
                    <button id="btn-download-new" class="btn primary">Скачать как новый файл</button>
                    <button id="btn-append-file" class="btn secondary">Добавить в существующий файл</button>
                </div>
            </header>
            
            <div id="data-container" class="data-grid">
                <!-- Карточки с данными генерируются через JS -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
