<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Дневник</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121214">
</head>
<body>

  <div class="app">
    <!-- Шапка с календарем и кнопкой меню -->
    <header class="header">
      <div class="month-selector">
        <button id="prev-month">‹</button>
        <h2 id="month-title">Сентябрь 2026</h2>
        <button id="next-month">›</button>
      </div>
      <button id="menu-btn" class="icon-btn">☰</button>
    </header>

    <!-- Дни недели -->
    <div class="weekdays">
      <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
    </div>

    <!-- Сетка дней -->
    <div id="calendar-days" class="calendar-grid"></div>

    <!-- Разделитель с датой -->
    <div class="day-header">
      <h3 id="selected-date-title">25 сентября</h3>
      <div class="moods">
        <button class="mood-btn" data-mood="😊">😊</button>
        <button class="mood-btn" data-mood="🙂">🙂</button>
        <button class="mood-btn" data-mood="😐">😐</button>
        <button class="mood-btn" data-mood="😔">😔</button>
        <button class="mood-btn" data-mood="🔥">🔥</button>
      </div>
    </div>

    <!-- Список дочерних карточек дня -->
    <div id="cards-container" class="cards-container"></div>

    <!-- Кнопка добавления новой карточки в текущий день -->
    <button id="add-card-btn" class="fab-btn">+</button>
  </div>

  <!-- МЕНЮ (БОКОВАЯ ШТОРКА) -->
  <div id="menu-overlay" class="overlay hidden">
    <div class="drawer">
      <div class="drawer-header">
        <h3>Меню</h3>
        <button id="close-menu-btn" class="icon-btn">✕</button>
      </div>
      <div class="drawer-content">
        <button id="export-btn" class="menu-action-btn">📥 Скачать бэкап</button>
        <label class="menu-action-btn">
          📤 Загрузить файл
          <input type="file" id="import-file" accept=".json" style="display: none;">
        </label>
        <button id="ai-chat-btn" class="menu-action-btn ai-btn">🤖 AI Чат / Вопросы</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ДЛЯ СОЗДАНИЯ / РЕДАКТИРОВАНИЯ КАРТОЧКИ -->
  <div id="editor-overlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-card-title">Новая карточка</h3>
        <button id="close-editor-btn" class="icon-btn">✕</button>
      </div>

      <input type="text" id="card-topic-input" placeholder="Тема / Заголовок...">
      <textarea id="card-desc-input" placeholder="Описание..."></textarea>

      <!-- Блок загрузки и галереи фото -->
      <div class="photo-section">
        <label class="photo-add-btn">
          📷 Добавить фото
          <input type="file" id="photo-input" accept="image/*" style="display: none;">
        </label>
        <div id="modal-photo-list" class="modal-photo-list"></div>
      </div>

      <div class="modal-actions">
        <button id="delete-card-btn" class="del-btn hidden">Удалить</button>
        <button id="save-card-btn" class="save-btn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО AI ЧАТА -->
  <div id="ai-overlay" class="overlay hidden">
    <div class="modal ai-modal">
      <div class="modal-header">
        <h3>🤖 AI Ассистент</h3>
        <button id="close-ai-btn" class="icon-btn">✕</button>
      </div>
      <div id="ai-messages" class="ai-messages">
        <div class="msg ai">Привет! Напиши мне любой вопрос по твоим заметкам.</div>
      </div>
      <div class="ai-input-bar">
        <input type="text" id="ai-input" placeholder="Задай вопрос...">
        <button id="ai-send-btn">➔</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
