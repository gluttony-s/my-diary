<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Дневник</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121214">
</head>
<body>

  <div class="app">
    <!-- Шапка: Переключение недель -->
    <header class="header">
      <div class="month-selector">
        <button id="prev-week">‹</button>
        <h2 id="month-title">Сентябрь 2026</h2>
        <button id="next-week">›</button>
      </div>
    </header>

    <!-- Компактная текущая неделя (7 дней) -->
    <div id="week-days" class="week-grid"></div>

    <!-- Заголовок выбранного дня и настроение -->
    <div class="day-header">
      <h3 id="selected-date-title">25 сентября</h3>
      <div class="moods">
        <button class="mood-btn" data-mood="😊">😊</button>
        <button class="mood-btn" data-mood="🙂">🙂</button>
        <button class="mood-btn" data-mood="😐">😐</button>
        <button class="mood-btn" data-mood="😔">😔</button>
        <button class="mood-btn" data-mood="🔥">🔥</button>
      </div>
    </div>

    <!-- Список карточек выбранного дня -->
    <div id="cards-container" class="cards-container"></div>

    <!-- Кнопка добавления карточки (+) -->
    <button id="add-card-btn" class="fab-btn">+</button>

    <!-- РАДИАЛЬНОЕ МЕНЮ (3 полоски разлетаются на кружочки) -->
    <div class="radial-menu-container">
      <button id="radial-toggle-btn" class="radial-main-btn">
        <span class="bar bar1"></span>
        <span class="bar bar2"></span>
        <span class="bar bar3"></span>
      </button>

      <div id="radial-options" class="radial-options hidden">
        <button id="opt-ai" class="radial-item" title="AI Ассистент">🤖</button>
        <button id="opt-export" class="radial-item" title="Скачать бэкап">📥</button>
        <label class="radial-item" title="Загрузить бэкап">
          📤
          <input type="file" id="import-file" accept=".json" style="display: none;">
        </label>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ / РЕДАКТИРОВАНИЯ КАРТОЧКИ -->
  <div id="editor-overlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-card-title">Новая карточка</h3>
        <button id="close-editor-btn" class="icon-btn">✕</button>
      </div>

      <input type="text" id="card-topic-input" placeholder="Тема / Заголовок...">
      <textarea id="card-desc-input" placeholder="Описание..."></textarea>

      <div class="photo-section">
        <label class="photo-add-btn">
          📷 Добавить фото
          <input type="file" id="photo-input" accept="image/*" style="display: none;">
        </label>
        <div id="modal-photo-list" class="modal-photo-list"></div>
      </div>

      <div class="modal-actions">
        <button id="delete-card-btn" class="del-btn hidden">Удалить</button>
        <button id="save-card-btn" class="save-btn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО УМНОГО AI -->
  <div id="ai-overlay" class="overlay hidden">
    <div class="modal ai-modal">
      <div class="modal-header">
        <h3>🤖 Умный AI-помощник</h3>
        <button id="close-ai-btn" class="icon-btn">✕</button>
      </div>
      <div class="ai-box">
        <input type="password" id="ai-key-input" placeholder="Вставь Gemini API Key..." style="background:#27272a; border:1px solid #3f3f46; color:#fff; padding:8px; border-radius:6px; font-size:12px;">
        <textarea id="ai-question-input" placeholder="Спроси что угодно по своим записям (например: «Когда я последний раз тренировался?»)"></textarea>
        <button id="ai-ask-btn" class="save-btn">Спросить AI</button>
        <div id="ai-response-area" class="ai-response hidden"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
