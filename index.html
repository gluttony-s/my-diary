<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Дневник</title>
  <link rel="stylesheet" href="style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

  <div class="app">
    <!-- Кнопки экспорта/импорта -->
    <div class="backup-bar">
      <button id="export-btn" class="backup-btn">📥 Скачать бэкап</button>
      <label class="backup-btn">
        📤 Загрузить файл
        <input type="file" id="import-file" accept=".json" style="display: none;">
      </label>
    </div>

    <!-- Шапка с месяцем -->
    <header class="header">
      <button id="prev-month">‹</button>
      <h2 id="month-title">Сентябрь 2026</h2>
      <button id="next-month">›</button>
    </header>

    <!-- Дни недели -->
    <div class="weekdays">
      <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
    </div>

    <!-- Сетка дней -->
    <div id="calendar-days" class="calendar-grid"></div>

    <!-- Область записи -->
    <div class="editor">
      <div class="editor-bar">
        <span id="selected-date-text">24 сентября</span>
        
        <div class="moods">
          <button class="mood-btn" data-mood="😊">😊</button>
          <button class="mood-btn" data-mood="🙂">🙂</button>
          <button class="mood-btn" data-mood="😐">😐</button>
          <button class="mood-btn" data-mood="😔">😔</button>
          <button class="mood-btn" data-mood="🔥">🔥</button>
        </div>
      </div>

      <input type="text" id="note-title" placeholder="Заголовок дня...">
      <textarea id="note-content" placeholder="Напиши, как прошёл день..."></textarea>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
